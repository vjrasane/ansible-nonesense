[project]
name = "sensible-worker"
version = "0.0.1"
description = "GPL action-plugin harness for the sensible runtime"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["ansible-core==2.19.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sensible_worker"]
