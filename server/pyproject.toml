[project]
name = "ansible-jsonrpc-server"
version = "0.0.1"
description = "A JSON-RPC server for executing Ansible modules over stdin/stdout"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["ansible-core==2.19.13", "msgspec>=0.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ansible_jsonrpc_server"]

[tool.pyright]
# Resolve imports against the devenv venv (ansible-core, msgspec) and treat server/
# as a source root so `ansible_jsonrpc_server.*` resolves (it's not pip-installed).
venvPath = "../.devenv/state"
venv = "venv"
extraPaths = ["."]
pythonVersion = "3.12"
